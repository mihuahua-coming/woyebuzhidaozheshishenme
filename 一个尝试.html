<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户满意度调查</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s;
        }
        #game-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 90%;
            text-align: center;
            transition: all 0.3s;
        }
        #survey-header {
            color: #333;
            font-size: 14px;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
        }
        #scene-text {
            font-size: 20px;
            margin-bottom: 25px;
            line-height: 1.8;
            color: #333;
            transition: color 0.3s;
            white-space: pre-line;
        }
        .option-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f8f8f8;
            color: #333;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background-color: #e8e8e8;
            border-color: #bbb;
        }
        #end-message {
            color: #999;
            font-style: italic;
        }
        #progress-bar {
            width: 100%;
            height: 3px;
            background-color: #eee;
            margin-bottom: 20px;
            border-radius: 2px;
        }
        #progress-fill {
            height: 100%;
            background-color: #4CAF50;
            border-radius: 2px;
            transition: width 0.3s;
        }

        /* 欢迎页面样式 */
        .welcome-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        .welcome-subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .start-btn {
            background-color: #4CAF50;
            color: white;
            font-size: 18px;
            padding: 15px 40px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            display: block;
            width: 100%;
            margin: 10px 0;
        }
        .start-btn:hover {
            background-color: #45a049;
        }

        /* 结局收集页面样式 */
        .endings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .ending-card {
            background: #f8f8f8;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            cursor: default;
            transition: all 0.3s;
        }
        .ending-card.unlocked {
            background: #fff0f0;
            border-color: #ff6666;
        }
        .ending-card.locked {
            opacity: 0.6;
        }
        .ending-card-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        .ending-card.unlocked .ending-card-title {
            color: #ff0000;
        }
        .ending-card-content {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        /* 恐怖模式样式 */
        body.horror-mode {
            background-color: #000;
        }
        body.horror-mode #game-container {
            background: #1a0000;
            box-shadow: 0 0 40px rgba(255,0,0,0.3);
        }
        body.horror-mode #scene-text {
            color: #ff0000;
        }
        body.horror-mode #survey-header {
            color: #660000;
            border-bottom-color: #330000;
        }

        /* 闪屏效果 */
        .flash-effect {
            animation: flash 0.1s infinite;
        }
        @keyframes flash {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        
        /* 红色闪屏文字 */
        .glitch-text {
            animation: redPulse 0.05s infinite;
            color: #ff0000 !important;
            text-shadow: 
                0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 40px #ff0000;
            font-weight: bold;
        }
        @keyframes redPulse {
            0% { 
                text-shadow: 
                    0 0 10px #ff0000,
                    0 0 20px #ff0000,
                    0 0 40px #ff0000;
                transform: translate(0);
            }
            25% { 
                text-shadow: 
                    0 0 15px #ff0000,
                    0 0 30px #ff0000,
                    0 0 60px #ff0000;
                transform: translate(-2px, 1px);
            }
            50% { 
                text-shadow: 
                    0 0 10px #ff0000,
                    0 0 20px #ff0000,
                    0 0 40px #ff0000;
                transform: translate(2px, -1px);
            }
            75% { 
                text-shadow: 
                    0 0 15px #ff0000,
                    0 0 30px #ff0000,
                    0 0 60px #ff0000;
                transform: translate(-1px, -2px);
            }
            100% { 
                text-shadow: 
                    0 0 10px #ff0000,
                    0 0 20px #ff0000,
                    0 0 40px #ff0000;
                transform: translate(1px, 2px);
            }
        }

        /* 结局特殊样式 */
        .ending-text {
            font-size: 22px;
            font-weight: bold;
            color: #ff0000 !important;
            text-shadow: 0 0 20px #ff0000;
            animation: none !important;
        }
        .ending-subtitle {
            font-size: 16px;
            color: #cc0000;
            margin-top: 15px;
            font-weight: normal;
            text-shadow: none;
        }
        .ending-title {
            font-size: 14px;
            color: #ff6666;
            margin-top: 20px;
            font-style: italic;
            font-weight: normal;
            text-shadow: none;
        }

        @media (max-width: 600px) {
            #game-container {
                width: 95%;
                padding: 20px;
            }
            #scene-text {
                font-size: 18px;
            }
            .option-btn, .start-btn {
                font-size: 15px;
                padding: 10px;
            }
            .endings-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

            // ===== 七个结局（保持不变） =====
            "normal_ending": {

                endingType: "reality",
                endingId: "reality_ending"
            },
            "meta_ending": {

                subtitle: "你以为你只是随便点点按钮。但问卷知道你的名字。它一直都知道。",
                endingType: "meta",
                endingId: "meta_ending"
            },
            "true_ending": {
                text: "问卷完成了。最后一个回答者已经出现。门开了。",
                subtitle: "在永恒的宅邸拉莱耶中，长眠的克苏鲁候汝入梦。",

        // ========== 游戏逻辑 ==========
        let currentSceneId = "welcome";
        const flashScenes = ["flash1", "flash1_mirror", "flash2", "flash3", "flash4", "flash5"];
        const endingNames = {
            normal: "【结局：无知的幸福】",
            nightmare: "【结局：永夜梦魇】",
            awakening: "【结局：真相大白】",
            madness: "【结局：疯狂深渊】",
            reality: "【结局：现实崩塌】",
            meta: "【结局：打破第四面墙】",
            true: "【真结局：克苏鲁的召唤】"
        };

        function showScene(sceneId) {
            if (sceneId === "restart") {
                resetGameState();
                showScene("q1");
                return;
            }

            const scene = scenes[sceneId];
            
            if (sceneId === "welcome") {
                showWelcomePage();
                return;
            }
            
            if (sceneId === "endings") {
                showEndingsPage();
                return;
            }

            if (!scene) {
                console.error("场景不存在:", sceneId);
                return;
            }

            // 记录访问的场景
            if (!gameState.visitedScenes.includes(sceneId)) {
                gameState.visitedScenes.push(sceneId);
            }

            // 显示游戏界面元素
            document.getElementById("survey-header").style.display = "block";
            document.getElementById("progress-bar").style.display = "block";

            // 清除之前的闪屏效果
            clearFlashEffects();

            // 更新文字
            const textElement = document.getElementById("scene-text");
            textElement.innerText = scene.text;

            // 检查场景类型并应用相应样式
            if (flashScenes.includes(sceneId)) {
                startFlashEffects(textElement, sceneId);
            } else if (sceneId.includes("ending")) {
                if (scene.endingId) {
                    unlockEnding(scene.endingId);
                }
                showEnding(scene);
                return;
            } else if (sceneId.startsWith("horror") || sceneId === "transition1" || sceneId === "transition1_mirror") {
                document.body.classList.add("horror-mode");
                textElement.classList.add("glitch-text");
                document.getElementById("survey-header").innerText = "⚠️ 系统错误";
            } else {
                resetToNormalMode();
                document.getElementById("survey-header").innerText = "📋 用户满意度调查问卷";
            }

            // 更新进度条
            updateProgress(sceneId);

            // 清空并重新生成选项按钮
            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            // 闪屏场景处理
            if (flashScenes.includes(sceneId)) {
                const flashOrder = ["flash1", "flash2", "flash3", "flash4", "flash5"];
                const mirrorFlashOrder = ["flash1_mirror", "flash2", "flash3", "flash4", "flash5"];
                
                const currentOrder = sceneId === "flash1_mirror" ? mirrorFlashOrder : flashOrder;
                const currentIndex = currentOrder.indexOf(sceneId);
                
                setTimeout(() => {
                    if (currentIndex < currentOrder.length - 1) {
                        showScene(currentOrder[currentIndex + 1]);
                    } else {
                        const endingId = determineEnding();
                        showScene(endingId);
                    }
                }, 2000);
                return;
            }

            // 生成选项按钮
            if (scene.options && scene.options.length > 0) {
                scene.options.forEach(option => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn";
                    btn.innerText = option.text;
                    btn.onclick = () => {
                        handleOptionClick(option);
                    };
                    optionsContainer.appendChild(btn);
                });
            }
        }

        function resetToNormalMode() {
            const textElement = document.getElementById("scene-text");
            const container = document.getElementById("game-container");
            const body = document.body;
            
            body.classList.remove("horror-mode");
            textElement.classList.remove("glitch-text", "ending-text", "flash-effect");
            
            textElement.style.cssText = "";
            container.style.animation = "";
            container.style.boxShadow = "";
            body.style.backgroundColor = "#f5f5f5";
            
            textElement.style.color = "#333";
            textElement.style.fontSize = "20px";
            textElement.style.fontWeight = "normal";
            textElement.style.textShadow = "none";
            
            container.style.backgroundColor = "white";
            container.style.boxShadow = "0 4px 20px rgba(0,0,0,0.1)";
            
            const progressFill = document.getElementById("progress-fill");
            if (progressFill) {
                progressFill.style.backgroundColor = "#4CAF50";
            }
        }

        function showWelcomePage() {
            document.getElementById("survey-header").style.display = "none";
            document.getElementById("progress-bar").style.display = "none";
            
            resetToNormalMode();
            
            const textElement = document.getElementById("scene-text");
            const optionsContainer = document.getElementById("options-container");
            
            textElement.innerHTML = `
                <div class="welcome-title">用户满意度调查</div>
                <div class="welcome-subtitle">
                    感谢您参与本次调查。<br>
                    我们将询问一些关于您日常习惯的问题。<br>
                    请如实回答。这很重要。
                </div>
            `;
            
            optionsContainer.innerHTML = '';
            
            const startBtn = document.createElement("button");
            startBtn.className = "start-btn";
            startBtn.innerText = "开始测试";
            startBtn.onclick = () => {
                resetGameState();
                showScene("q1");
            };
            optionsContainer.appendChild(startBtn);
            
            const unlockedEndings = getUnlockedEndings();
            if (unlockedEndings.length > 0) {
                const viewEndingsBtn = document.createElement("button");
                viewEndingsBtn.className = "option-btn";
                viewEndingsBtn.style.marginTop = "15px";
                viewEndingsBtn.innerText = `查看结局 (${unlockedEndings.length}/${Object.keys(allEndings).length})`;
                viewEndingsBtn.onclick = () => {
                    showEndingsPage();
                };
                optionsContainer.appendChild(viewEndingsBtn);
            }
        }

        function showEndingsPage() {
            document.getElementById("survey-header").style.display = "none";
            document.getElementById("progress-bar").style.display = "none";
            
            resetToNormalMode();
            
            const textElement = document.getElementById("scene-text");
            const optionsContainer = document.getElementById("options-container");
            
            const unlockedEndings = getUnlockedEndings();
            
            let endingsHTML = '<div class="welcome-title">已解锁的结局</div>';
            endingsHTML += '<div class="endings-grid">';
            
            Object.keys(allEndings).forEach(endingId => {
                const ending = allEndings[endingId];
                const isUnlocked = unlockedEndings.includes(endingId);
                
                endingsHTML += `
                    <div class="ending-card ${isUnlocked ? 'unlocked' : 'locked'}">
                        <div class="ending-card-title">
                            ${isUnlocked ? ending.name : '？？？'}
                        </div>
                        <div class="ending-card-content">
                            ${isUnlocked ? ending.description : '尚未解锁'}
                        </div>
                    </div>
                `;
            });
            
            endingsHTML += '</div>';
            
            textElement.innerHTML = endingsHTML;
            
            optionsContainer.innerHTML = '';
            
            const backBtn = document.createElement("button");
            backBtn.className = "option-btn";
            backBtn.innerText = "返回主页";
            backBtn.onclick = () => {
                showWelcomePage();
            };
            optionsContainer.appendChild(backBtn);
        }

        function showEnding(scene) {
            const textElement = document.getElementById("scene-text");
            const optionsContainer = document.getElementById("options-container");
            
            document.body.classList.remove("horror-mode");
            textElement.classList.remove("glitch-text", "flash-effect");
            document.getElementById("game-container").style.animation = "";
            
            document.body.classList.add("horror-mode");
            textElement.classList.add("ending-text");
            
            let endingHTML = scene.text;
            
            if (scene.subtitle) {
                endingHTML += `<div class="ending-subtitle">${scene.subtitle}</div>`;
            }
            
            if (scene.endingType && endingNames[scene.endingType]) {
                endingHTML += `<div class="ending-title">${endingNames[scene.endingType]}</div>`;
            }
            
            textElement.innerHTML = endingHTML;
            
            optionsContainer.innerHTML = '';
            
            const restartBtn = document.createElement("button");
            restartBtn.className = "option-btn";
            restartBtn.innerText = "重新开始游戏";
            restartBtn.onclick = () => {
                resetGameState();
                showScene("q1");
            };
            optionsContainer.appendChild(restartBtn);
            
            const homeBtn = document.createElement("button");
            homeBtn.className = "option-btn";
            homeBtn.innerText = "返回主页";
            homeBtn.onclick = () => {
                showWelcomePage();
            };
            optionsContainer.appendChild(homeBtn);
            
            const viewEndingsBtn = document.createElement("button");
            viewEndingsBtn.className = "option-btn";
            viewEndingsBtn.innerText = "查看所有结局";
            viewEndingsBtn.onclick = () => {
                showEndingsPage();
            };
            optionsContainer.appendChild(viewEndingsBtn);
        }

        function handleOptionClick(option) {
            if (option.effect) {
                if (option.effect.sanity) {
                    gameState.sanity = Math.max(0, Math.min(100, gameState.sanity + option.effect.sanity));
                }
                if (option.effect.insight) {
                    gameState.insight += option.effect.insight;
                }
                if (option.effect.noSleep) {
                    gameState.noSleepCount++;
                }
                if (option.effect.forget) {
                    gameState.forgetCount++;
                }
            }
            
            updateInterfaceBySanity();
            showScene(option.next);
        }

        function determineEnding() {
            const {sanity, insight, noSleepCount, forgetCount} = gameState;
            
            console.log("当前状态 - 理智:", sanity, "洞察:", insight, "不睡觉次数:", noSleepCount, "不记得次数:", forgetCount);
            
            if (insight > 90 && sanity < 20) {
                return "true_ending";
            } else if (noSleepCount >= 2) {
                return "reality_ending";
            } else if (forgetCount >= 2) {
                return "meta_ending";
            } else if (sanity < 30) {
                return "madness_ending";
            } else if (insight > 70 && sanity > 50) {
                return "awakening_ending";
            } else if (sanity < 60 && insight < 30) {
                return "nightmare_ending";
            } else {
                return "normal_ending";
            }
        }

        function updateInterfaceBySanity() {
            const body = document.body;
            const container = document.getElementById("game-container");
            
            if (gameState.sanity < 30) {
                body.style.backgroundColor = "#1a0000";
                container.style.boxShadow = "0 0 60px rgba(255,0,0,0.5)";
            } else if (gameState.sanity < 60) {
                body.style.backgroundColor = "#2a1a1a";
                container.style.boxShadow = "0 0 30px rgba(255,0,0,0.3)";
            } else {
                body.style.backgroundColor = "#f5f5f5";
                container.style.boxShadow = "0 4px 20px rgba(0,0,0,0.1)";
            }
        }

        function startFlashEffects(textElement, sceneId) {
            textElement.classList.add("flash-effect", "glitch-text");
            document.body.classList.add("horror-mode");
            document.getElementById("survey-header").innerText = "⚠️ 系统错误";
            document.getElementById("game-container").style.animation = "shake 0.1s infinite";
        }

        function clearFlashEffects() {
            const textElement = document.getElementById("scene-text");
            textElement.classList.remove("flash-effect", "glitch-text", "ending-text");
            document.getElementById("game-container").style.animation = "";
        }

        function updateProgress(sceneId) {
            const progressFill = document.getElementById("progress-fill");
            const totalScenes = Object.keys(scenes).filter(key => 
                key.startsWith("q") || key.startsWith("transition") || key.startsWith("horror") || key.startsWith("flash")
            ).length;
            
            const sceneIndex = gameState.visitedScenes.length;
            const progress = Math.min((sceneIndex / totalScenes) * 100, 100);
            
            progressFill.style.width = progress + "%";
            
            if (sceneId.startsWith("horror") || sceneId.startsWith("flash") || sceneId.startsWith("transition")) {
                progressFill.style.backgroundColor = "#ff0000";
            } else {
                progressFill.style.backgroundColor = "#4CAF50";
            }
        }

        // 添加震动动画
        const styleSheet = document.createElement("style");
        styleSheet.textContent = `
            @keyframes shake {
                0% { transform: translate(0, 0); }
                25% { transform: translate(-5px, 5px); }
                50% { transform: translate(5px, -5px); }
                75% { transform: translate(-5px, -5px); }
                100% { transform: translate(5px, 5px); }
            }
        `;
        document.head.appendChild(styleSheet);

        // 启动游戏
        showScene("welcome");
    </script>
